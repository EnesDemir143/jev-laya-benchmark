[project]
name = "jev-tryout"
version = "0.1.0"
description = "Classify oh-my-pi GitHub issues with TypeSafe Jev"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_classifier"]

[tool.uv]
package = true
